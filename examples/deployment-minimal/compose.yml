services:
  web:
    build:
      context: examples/deployment-minimal
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 1s
      timeout: 2s
      retries: 30
  debug:
    image: busybox:1.37
    profiles: [debug]
    command: ["sleep", "3600"]
