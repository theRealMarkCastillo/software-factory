[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-software-factory"
version = "0.1.0"
description = "Hermes-first software delivery workflows with a standalone verification engine"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.16"]
audit = ["pip-audit>=2.7"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.16", "pip-audit>=2.7"]

[project.scripts]
factory-run = "factory.runner:main"
factory-audit = "factory.audit:main"
factory-coverage = "factory.coverage:main"
factory-datamodel = "factory.datamodel:main"
factory-verify = "factory.verify:main"
factory-promote = "factory.promote:main"

[tool.setuptools.packages.find]
include = ["factory*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
